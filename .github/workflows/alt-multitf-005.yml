name: Build and publish ALT-MULTITF-005

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Resume a checkpoint or restart from an empty workspace
        required: true
        default: resume
        type: choice
        options: [resume, restart]
      resume_run_id:
        description: Previous Actions run ID containing a checkpoint (optional)
        required: false
        type: string
      workers:
        description: Parallel download workers
        required: true
        default: '12'
        type: string

concurrency:
  group: alt-multitf-005-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PYTHONUNBUFFERED: '1'
      WORKSPACE: .alt-multitf-005
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore requested checkpoint
        if: inputs.mode == 'resume' && inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.resume_run_id }}" --pattern 'alt-multitf-005-checkpoint-*' --dir checkpoint-download

      - name: Unpack checkpoint
        if: inputs.mode == 'resume' && inputs.resume_run_id != ''
        run: |
          checkpoint=$(find checkpoint-download -type f -name 'checkpoint.tar' -print -quit)
          test -n "$checkpoint"
          tar -xf "$checkpoint"
          test -f "$WORKSPACE/checkpoint/state.json"

      - name: Build with checkpoints
        run: python scripts/build_altcoin_multitf_005.py --workspace "$WORKSPACE" --mode "${{ inputs.mode }}" --workers "${{ inputs.workers }}"

      - name: Publish content-addressed public Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/publish_altcoin_multitf_005.mjs "$WORKSPACE/release/altcoin-multitf-005.tar.gz" "$WORKSPACE/release/blob-result.json"

      - name: Verify full Blob anonymously
        env:
          BLOB_READ_WRITE_TOKEN: ''
        run: python scripts/verify_altcoin_multitf_005_blob.py "$WORKSPACE/release/blob-result.json" --output "$WORKSPACE/release/verified-release.json"

      - name: Write release summary
        run: |
          python scripts/write_altcoin_multitf_005_summary.py "$WORKSPACE" "$GITHUB_STEP_SUMMARY" "${{ github.sha }}" "${{ github.run_id }}"

      - name: Pack resumable checkpoint
        if: always()
        run: |
          if test -d "$WORKSPACE"; then tar -cf checkpoint.tar "$WORKSPACE"; fi

      - name: Upload resumable checkpoint
        if: always() && hashFiles('checkpoint.tar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: alt-multitf-005-checkpoint-${{ github.run_id }}
          path: checkpoint.tar
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload verified release metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alt-multitf-005-release-${{ github.run_id }}
          path: |
            ${{ env.WORKSPACE }}/release/build-result.json
            ${{ env.WORKSPACE }}/release/verified-release.json
          retention-days: 90
          if-no-files-found: error
